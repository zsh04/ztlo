<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Zyra - Idle 5/6">
  <defs>
    <!-- Cerulean Cloak Gradients -->
    <linearGradient id="cloakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="25%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="cloakShadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <!-- Coral Scarf Gradients -->
    <linearGradient id="scarfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="30%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <!-- Ground Ambient Shadow -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#0F172A" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground Contact Shadow (80px playfield footprint) -->
  <ellipse cx="80.0" cy="141.0" rx="28.4" ry="7.2" fill="url(#groundShadow)"/>

  <!-- Main Character Group -->
  <g>
    <!-- Back Hair Volume -->
    <path d="M 56.0 61.2 C 52.0 79.2 58.0 91.2 66.0 95.2 
             C 80.0 97.2 94.0 95.2 102.0 91.2 
             C 108.0 79.2 104.0 61.2 Z" fill="#0F172A"/>

    <!-- Left Leg & Boot -->
    <g transform="rotate(0.0 68.0 105.2)">
      <path d="M 64.0 105.2 L 65.0 132.0 L 71.0 132.0 L 72.0 105.2 Z" fill="#475569"/>
      <!-- Explorer Boot Left -->
      <path d="M 63.0 132.0 Q 63.0 138.0 60.0 140.0 L 73.0 140.0 Q 74.0 135.0 72.0 132.0 Z" fill="#334155"/>
      <path d="M 60.0 139.0 L 74.0 139.0 L 73.0 141.0 L 61.0 141.0 Z" fill="#1E293B"/>
    </g>

    <!-- Right Leg & Boot -->
    <g transform="rotate(0.0 92.0 105.2)">
      <path d="M 88.0 105.2 L 89.0 132.0 L 95.0 132.0 L 96.0 105.2 Z" fill="#475569"/>
      <!-- Explorer Boot Right -->
      <path d="M 88.0 132.0 Q 86.0 135.0 87.0 140.0 L 100.0 140.0 Q 97.0 138.0 97.0 132.0 Z" fill="#334155"/>
      <path d="M 87.0 139.0 L 100.0 139.0 L 99.0 141.0 L 88.0 141.0 Z" fill="#1E293B"/>
    </g>

    <!-- Cerulean Cloak Underlayer -->
    <g transform="rotate(0.5 80.0 85.2)">
      <!-- Back Hem Flap -->
      <path d="M 54.0 99.2 Q 80.0 103.2 106.0 99.2 
               L 108.0 119.2 Q 80.0 123.2 52.0 119.2 Z" 
            fill="url(#cloakShadowGrad)"/>

      <!-- Primary Ghibli Poncho / Cloak (#0284C7 cerulean teal) -->
      <path d="M 64.0 81.2 
               C 56.0 87.2 50.0 101.2 52.0 117.2 
               Q 54.0 121.2 60.0 120.2 
               C 70.0 118.2 90.0 118.2 100.0 120.2 
               Q 106.0 121.2 108.0 117.2 
               C 110.0 101.2 104.0 87.2 96.0 81.2 Z" 
            fill="url(#cloakGrad)"/>

      <!-- Cloak Fold Highlights & Seam Detailing -->
      <path d="M 66.0 85.2 Q 58.0 105.2 64.0 119.2" 
            stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.6"/>
      <path d="M 80.0 89.2 L 80.0 118.2" 
            stroke="#0369A1" stroke-width="2.0" stroke-linecap="round" fill="none" opacity="0.7"/>
      <path d="M 94.0 85.2 Q 102.0 105.2 96.0 119.2" 
            stroke="#0369A1" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8"/>
    </g>

    <!-- Arms Layer -->
    
        <!-- Resting Hands Tucked Neatly in Cloak -->
        <ellipse cx="66.0" cy="101.2" rx="4.5" ry="6" fill="#0284C7" />
        <circle cx="68.0" cy="105.2" r="3.5" fill="#FED7AA" />
        <ellipse cx="94.0" cy="101.2" rx="4.5" ry="6" fill="#0284C7" />
        <circle cx="92.0" cy="105.2" r="3.5" fill="#FED7AA" />
        

    <!-- Trailing Scarf Ribbon (Back fold) -->
    <g transform="rotate(1.5 90.0 71.2)">
      <path d="M 90.0 71.2 
               Q 104.0 77.2 114.0 87.2 
               Q 106.0 91.2 94.0 79.2 Z" 
            fill="#EA580C"/>
      <path d="M 94.0 75.2 
               Q 110.0 83.2 118.0 93.2 
               Q 112.0 99.2 96.0 81.2 Z" 
            fill="url(#scarfGrad)"/>
      <path d="M 114.0 92.2 L 117.0 94.2" stroke="#FED7AA" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Head / Face (Warm Soft Peach #FED7AA) -->
    <circle cx="80.0" cy="55.2" r="19" fill="#FED7AA"/>
    <!-- Subtle Rosy Cheeks -->
    <ellipse cx="69.0" cy="61.2" rx="4.5" ry="2.6" fill="#FDA4AF" opacity="0.75"/>
    <ellipse cx="91.0" cy="61.2" rx="4.5" ry="2.6" fill="#FDA4AF" opacity="0.75"/>
    <!-- Tiny Cute Nose -->
    <circle cx="80.0" cy="60.2" r="0.9" fill="#FDBA74"/>

    <!-- Eyes Layer -->
    
        <!-- Sleeping / Closed Peaceful Eyelashes -->
        <path d="M 69.0 55.2 Q 73.0 58.2 77.0 55.2" stroke="#0F172A" stroke-width="2.4" stroke-linecap="round" fill="none" />
        <path d="M 83.0 55.2 Q 87.0 58.2 91.0 55.2" stroke="#0F172A" stroke-width="2.4" stroke-linecap="round" fill="none" />
        

    <!-- Mouth Layer -->
    
        <!-- Gentle Storybook Smile -->
        <path d="M 76.0 64.2 Q 80.0 68.2 84.0 64.2" stroke="#78350F" stroke-width="2.0" stroke-linecap="round" fill="none" />
        

    <!-- Front Storybook Hair Bangs (Soft Navy #1E293B) -->
    <path d="M 60.0 53.2 
             C 58.0 39.2 66.0 32.2 80.0 32.2 
             C 94.0 32.2 102.0 39.2 100.0 53.2 
             C 96.0 43.2 90.0 47.2 84.0 47.2 
             C 78.0 47.2 72.0 41.2 68.0 47.2 
             C 65.0 51.2 62.0 49.2 60.0 53.2 Z" 
          fill="#1E293B"/>

    <!-- Explorer Feather & Headband (#FBBF24 golden feather) -->
    <path d="M 61.0 47.2 Q 80.0 37.2 99.0 47.2" 
          stroke="#0D9488" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Feather Pin -->
    <path d="M 96.0 45.2 
             C 102.0 33.2 106.0 25.2 108.0 21.2 
             C 104.0 27.2 100.0 35.2 96.0 45.2 Z" 
          fill="#FBBF24"/>
    <path d="M 97.0 43.2 L 107.0 23.2" 
          stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="96.0" cy="46.2" r="2.2" fill="#0D9488"/>

    <!-- Warm Coral Scarf (#F97316 Front Wrap) -->
    <path d="M 62.0 68.2 
             C 66.0 65.2 94.0 65.2 98.0 68.2 
             C 100.0 74.2 96.0 78.2 86.0 79.2 
             C 74.0 79.2 64.0 76.2 62.0 68.2 Z" 
          fill="url(#scarfGrad)"/>
    <!-- Scarf Front Knot -->
    <ellipse cx="88.0" cy="73.2" rx="4.5" ry="4" fill="#EA580C"/>
    <ellipse cx="88.0" cy="72.2" rx="3.5" ry="3" fill="#F97316"/>
  </g>

  <!-- Optional FX (Sparkles/Sweat) -->
  
</svg>