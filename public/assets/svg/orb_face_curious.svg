<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Light Orb Face - Curious">
  <defs>
    <!-- Outer Ambient Glow -->
    <radialGradient id="orbHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <!-- Core Luminous Sphere -->
    <radialGradient id="orbBody" cx="38%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="18%" stop-color="#FEF08A"/>
      <stop offset="55%" stop-color="#FDE047"/>
      <stop offset="85%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
  </defs>

  <!-- Ambient Golden Aura (Radiates to 88px) -->
  <circle cx="48.0" cy="48.0" r="44" fill="url(#orbHalo)"/>

  <!-- Core Glowing Sphere Body (Radius 34px) -->
  <circle cx="48.0" cy="48.0" r="34.0" fill="url(#orbBody)"/>

  <!-- Glass Specular Highlight (Monument Valley clean reflection) -->
  <path d="M 32.0 24.0 Q 48.0 20.0 60.0 26.0 Q 54.0 32.0 38.0 30.0 Z" 
        fill="#FFFFFF" opacity="0.65"/>
  <circle cx="30.0" cy="36.0" r="3" fill="#FFFFFF" opacity="0.7"/>

  <!-- Facial Expression Layer -->
  
        <!-- Inquisitive Asymmetric Eyes -->
        <!-- Left Eye: Wide Curious Round -->
        <ellipse cx="39.0" cy="44.0" rx="4.2" ry="5.2" fill="#78350F"/>
        <circle cx="37.5" cy="42.5" r="1.8" fill="#FFFFFF"/>
        <!-- Right Eye: Inquisitive Arched Brow -->
        <path d="M 52.0 46.0 Q 57.0 40.0 62.0 46.0" 
              stroke="#78350F" stroke-width="3.2" stroke-linecap="round" fill="none"/>
        <ellipse cx="57.0" cy="46.0" rx="3.0" ry="2.2" fill="#78350F"/>
        <!-- Soft Blush Cheeks -->
        <ellipse cx="35.0" cy="53.0" rx="4.5" ry="2.6" fill="#FB7185" opacity="0.5"/>
        <ellipse cx="61.0" cy="53.0" rx="4.5" ry="2.6" fill="#FB7185" opacity="0.5"/>
        <!-- Cute 'O' Mouth Tilted with Wonder -->
        <ellipse cx="48.0" cy="56.0" rx="3.5" ry="4.5" fill="#78350F"/>
        <ellipse cx="48.0" cy="56.0" rx="2.0" ry="3.0" fill="#451A03"/>
        

  <!-- Atmospheric FX (Sparkles/Stardust) -->
  
        <!-- Curious Light Spark Floating Above -->
        <path d="M 66.0 20.0 Q 70.0 20.0 70.0 16.0 Q 70.0 20.0 74.0 20.0 Q 70.0 20.0 70.0 24.0 Z" fill="#FFFFFF"/>
        
</svg>