  <rect x="76" y="142" width="8" height="10" rx="2" fill="#B45309" stroke="#78350F" stroke-width="1.5" />
  <rect x="8" y="76" width="10" height="8" rx="2" fill="#B45309" stroke="#78350F" stroke-width="1.5" />

