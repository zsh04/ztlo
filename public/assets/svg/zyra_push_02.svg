<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Zyra - Push 2/6">
  <defs>
    <!-- Cerulean Cloak Gradients -->
    <linearGradient id="cloakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="25%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="cloakShadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <!-- Coral Scarf Gradients -->
    <linearGradient id="scarfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="30%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <!-- Ground Ambient Shadow -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#0F172A" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground Contact Shadow (80px playfield footprint) -->
  <ellipse cx="80.0" cy="141.0" rx="27.2" ry="6.7" fill="url(#groundShadow)"/>

  <!-- Main Character Group -->
  <g transform="rotate(16.5 80.0 97.5)">
    <!-- Back Hair Volume -->
    <path d="M 56.0 63.5 C 52.0 81.5 58.0 93.5 66.0 97.5 
             C 80.0 99.5 94.0 97.5 102.0 93.5 
             C 108.0 81.5 104.0 63.5 Z" fill="#0F172A"/>

    <!-- Left Leg & Boot -->
    <g transform="rotate(18.0 68.0 107.5)">
      <path d="M 64.0 107.5 L 65.0 132.0 L 71.0 132.0 L 72.0 107.5 Z" fill="#475569"/>
      <!-- Explorer Boot Left -->
      <path d="M 63.0 132.0 Q 63.0 138.0 60.0 140.0 L 73.0 140.0 Q 74.0 135.0 72.0 132.0 Z" fill="#334155"/>
      <path d="M 60.0 139.0 L 74.0 139.0 L 73.0 141.0 L 61.0 141.0 Z" fill="#1E293B"/>
    </g>

    <!-- Right Leg & Boot -->
    <g transform="rotate(-24.0 92.0 107.5)">
      <path d="M 88.0 107.5 L 89.0 132.0 L 95.0 132.0 L 96.0 107.5 Z" fill="#475569"/>
      <!-- Explorer Boot Right -->
      <path d="M 88.0 132.0 Q 86.0 135.0 87.0 140.0 L 100.0 140.0 Q 97.0 138.0 97.0 132.0 Z" fill="#334155"/>
      <path d="M 87.0 139.0 L 100.0 139.0 L 99.0 141.0 L 88.0 141.0 Z" fill="#1E293B"/>
    </g>

    <!-- Cerulean Cloak Underlayer -->
    <g transform="rotate(4.5 80.0 87.5)">
      <!-- Back Hem Flap -->
      <path d="M 54.0 101.5 Q 80.0 105.5 106.0 101.5 
               L 108.0 121.5 Q 80.0 125.5 52.0 121.5 Z" 
            fill="url(#cloakShadowGrad)"/>

      <!-- Primary Ghibli Poncho / Cloak (#0284C7 cerulean teal) -->
      <path d="M 64.0 83.5 
               C 56.0 89.5 50.0 103.5 52.0 119.5 
               Q 54.0 123.5 60.0 122.5 
               C 70.0 120.5 90.0 120.5 100.0 122.5 
               Q 106.0 123.5 108.0 119.5 
               C 110.0 103.5 104.0 89.5 96.0 83.5 Z" 
            fill="url(#cloakGrad)"/>

      <!-- Cloak Fold Highlights & Seam Detailing -->
      <path d="M 66.0 87.5 Q 58.0 107.5 64.0 121.5" 
            stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.6"/>
      <path d="M 80.0 91.5 L 80.0 120.5" 
            stroke="#0369A1" stroke-width="2.0" stroke-linecap="round" fill="none" opacity="0.7"/>
      <path d="M 94.0 87.5 Q 102.0 107.5 96.0 121.5" 
            stroke="#0369A1" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8"/>
    </g>

    <!-- Arms Layer -->
    
        <!-- Braced Push Arms Extended Forward -->
        <path d="M 88.0 85.5 Q 108.0 89.5 122.0 87.5" 
              stroke="#0284C7" stroke-width="10" stroke-linecap="round" fill="none" />
        <path d="M 88.0 91.5 Q 106.0 95.5 120.0 93.5" 
              stroke="#0369A1" stroke-width="8" stroke-linecap="round" fill="none" />
        <!-- Hands Planted on Stone -->
        <ellipse cx="123.0" cy="87.5" rx="4.5" ry="5.5" fill="#FED7AA" />
        <ellipse cx="121.0" cy="93.5" rx="4.5" ry="5.5" fill="#FED7AA" />
        

    <!-- Trailing Scarf Ribbon (Back fold) -->
    <g transform="rotate(9.0 90.0 73.5)">
      <path d="M 90.0 73.5 
               Q 104.0 79.5 114.0 89.5 
               Q 106.0 93.5 94.0 81.5 Z" 
            fill="#EA580C"/>
      <path d="M 94.0 77.5 
               Q 110.0 85.5 118.0 95.5 
               Q 112.0 101.5 96.0 83.5 Z" 
            fill="url(#scarfGrad)"/>
      <path d="M 114.0 94.5 L 117.0 96.5" stroke="#FED7AA" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Head / Face (Warm Soft Peach #FED7AA) -->
    <circle cx="80.0" cy="57.5" r="19" fill="#FED7AA"/>
    <!-- Subtle Rosy Cheeks -->
    <ellipse cx="69.0" cy="63.5" rx="4.5" ry="2.6" fill="#FDA4AF" opacity="0.75"/>
    <ellipse cx="91.0" cy="63.5" rx="4.5" ry="2.6" fill="#FDA4AF" opacity="0.75"/>
    <!-- Tiny Cute Nose -->
    <circle cx="80.0" cy="62.5" r="0.9" fill="#FDBA74"/>

    <!-- Eyes Layer -->
    
        <!-- Focused / Determined Push Eyes -->
        <ellipse cx="74.0" cy="57.5" rx="2.8" ry="3.5" fill="#0F172A" />
        <circle cx="73.0" cy="56.5" r="1.1" fill="#FFFFFF" />
        <ellipse cx="88.0" cy="57.5" rx="2.8" ry="3.5" fill="#0F172A" />
        <circle cx="87.0" cy="56.5" r="1.1" fill="#FFFFFF" />
        <!-- Determined Brow Lines -->
        <path d="M 69.0 51.5 L 77.0 53.5" stroke="#1E293B" stroke-width="2" stroke-linecap="round" />
        <path d="M 91.0 51.5 L 83.0 53.5" stroke="#1E293B" stroke-width="2" stroke-linecap="round" />
        

    <!-- Mouth Layer -->
    
        <!-- Determined Straight / Clenched Mouth -->
        <path d="M 76.0 67.5 L 84.0 66.5" stroke="#78350F" stroke-width="2.2" stroke-linecap="round" />
        

    <!-- Front Storybook Hair Bangs (Soft Navy #1E293B) -->
    <path d="M 60.0 55.5 
             C 58.0 41.5 66.0 34.5 80.0 34.5 
             C 94.0 34.5 102.0 41.5 100.0 55.5 
             C 96.0 45.5 90.0 49.5 84.0 49.5 
             C 78.0 49.5 72.0 43.5 68.0 49.5 
             C 65.0 53.5 62.0 51.5 60.0 55.5 Z" 
          fill="#1E293B"/>

    <!-- Explorer Feather & Headband (#FBBF24 golden feather) -->
    <path d="M 61.0 49.5 Q 80.0 39.5 99.0 49.5" 
          stroke="#0D9488" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Feather Pin -->
    <path d="M 96.0 47.5 
             C 102.0 35.5 106.0 27.5 108.0 23.5 
             C 104.0 29.5 100.0 37.5 96.0 47.5 Z" 
          fill="#FBBF24"/>
    <path d="M 97.0 45.5 L 107.0 25.5" 
          stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="96.0" cy="48.5" r="2.2" fill="#0D9488"/>

    <!-- Warm Coral Scarf (#F97316 Front Wrap) -->
    <path d="M 62.0 70.5 
             C 66.0 67.5 94.0 67.5 98.0 70.5 
             C 100.0 76.5 96.0 80.5 86.0 81.5 
             C 74.0 81.5 64.0 78.5 62.0 70.5 Z" 
          fill="url(#scarfGrad)"/>
    <!-- Scarf Front Knot -->
    <ellipse cx="88.0" cy="75.5" rx="4.5" ry="4" fill="#EA580C"/>
    <ellipse cx="88.0" cy="74.5" rx="3.5" ry="3" fill="#F97316"/>
  </g>

  <!-- Optional FX (Sparkles/Sweat) -->
  
</svg>