<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Zyra - Walk 7/8">
  <defs>
    <!-- Cerulean Cloak Gradients -->
    <linearGradient id="cloakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="25%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="cloakShadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <!-- Coral Scarf Gradients -->
    <linearGradient id="scarfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="30%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <!-- Ground Ambient Shadow -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#0F172A" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground Contact Shadow (80px playfield footprint) -->
  <ellipse cx="80.0" cy="141.0" rx="28.6" ry="7.2" fill="url(#groundShadow)"/>

  <!-- Main Character Group -->
  <g transform="rotate(3.5 80.0 94.8)">
    <!-- Back Hair Volume -->
    <path d="M 56.0 60.8 C 52.0 78.8 58.0 90.8 66.0 94.8 
             C 80.0 96.8 94.0 94.8 102.0 90.8 
             C 108.0 78.8 104.0 60.8 Z" fill="#0F172A"/>

    <!-- Left Leg & Boot -->
    <g transform="rotate(8.0 68.0 104.8)">
      <path d="M 64.0 104.8 L 65.0 132.0 L 71.0 132.0 L 72.0 104.8 Z" fill="#475569"/>
      <!-- Explorer Boot Left -->
      <path d="M 63.0 132.0 Q 63.0 138.0 60.0 140.0 L 73.0 140.0 Q 74.0 135.0 72.0 132.0 Z" fill="#334155"/>
      <path d="M 60.0 139.0 L 74.0 139.0 L 73.0 141.0 L 61.0 141.0 Z" fill="#1E293B"/>
    </g>

    <!-- Right Leg & Boot -->
    <g transform="rotate(-8.0 92.0 104.8)">
      <path d="M 88.0 104.8 L 89.0 132.0 L 95.0 132.0 L 96.0 104.8 Z" fill="#475569"/>
      <!-- Explorer Boot Right -->
      <path d="M 88.0 132.0 Q 86.0 135.0 87.0 140.0 L 100.0 140.0 Q 97.0 138.0 97.0 132.0 Z" fill="#334155"/>
      <path d="M 87.0 139.0 L 100.0 139.0 L 99.0 141.0 L 88.0 141.0 Z" fill="#1E293B"/>
    </g>

    <!-- Cerulean Cloak Underlayer -->
    <g transform="rotate(1.8 80.0 84.8)">
      <!-- Back Hem Flap -->
      <path d="M 54.0 98.8 Q 80.0 102.8 106.0 98.8 
               L 108.0 118.8 Q 80.0 122.8 52.0 118.8 Z" 
            fill="url(#cloakShadowGrad)"/>

      <!-- Primary Ghibli Poncho / Cloak (#0284C7 cerulean teal) -->
      <path d="M 64.0 80.8 
               C 56.0 86.8 50.0 100.8 52.0 116.8 
               Q 54.0 120.8 60.0 119.8 
               C 70.0 117.8 90.0 117.8 100.0 119.8 
               Q 106.0 120.8 108.0 116.8 
               C 110.0 100.8 104.0 86.8 96.0 80.8 Z" 
            fill="url(#cloakGrad)"/>

      <!-- Cloak Fold Highlights & Seam Detailing -->
      <path d="M 66.0 84.8 Q 58.0 104.8 64.0 118.8" 
            stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.6"/>
      <path d="M 80.0 88.8 L 80.0 117.8" 
            stroke="#0369A1" stroke-width="2.0" stroke-linecap="round" fill="none" opacity="0.7"/>
      <path d="M 94.0 84.8 Q 102.0 104.8 96.0 118.8" 
            stroke="#0369A1" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8"/>
    </g>

    <!-- Arms Layer -->
    
        <!-- Dynamic Running Arms Swing -->
        <path d="M 66.0 88.8 Q 58.8 100.8 60.0 106.8" 
              stroke="#0369A1" stroke-width="8" stroke-linecap="round" fill="none" />
        <circle cx="60.0" cy="107.8" r="4.5" fill="#FED7AA" />
        <path d="M 94.0 88.8 Q 101.2 100.8 100.0 106.8" 
              stroke="#0284C7" stroke-width="8" stroke-linecap="round" fill="none" />
        <circle cx="100.0" cy="107.8" r="4.5" fill="#FED7AA" />
        

    <!-- Trailing Scarf Ribbon (Back fold) -->
    <g transform="rotate(9.0 90.0 70.8)">
      <path d="M 90.0 70.8 
               Q 104.0 76.8 114.0 86.8 
               Q 106.0 90.8 94.0 78.8 Z" 
            fill="#EA580C"/>
      <path d="M 94.0 74.8 
               Q 110.0 82.8 118.0 92.8 
               Q 112.0 98.8 96.0 80.8 Z" 
            fill="url(#scarfGrad)"/>
      <path d="M 114.0 91.8 L 117.0 93.8" stroke="#FED7AA" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Head / Face (Warm Soft Peach #FED7AA) -->
    <circle cx="80.0" cy="54.8" r="19" fill="#FED7AA"/>
    <!-- Subtle Rosy Cheeks -->
    <ellipse cx="69.0" cy="60.8" rx="4.5" ry="2.6" fill="#FDA4AF" opacity="0.75"/>
    <ellipse cx="91.0" cy="60.8" rx="4.5" ry="2.6" fill="#FDA4AF" opacity="0.75"/>
    <!-- Tiny Cute Nose -->
    <circle cx="80.0" cy="59.8" r="0.9" fill="#FDBA74"/>

    <!-- Eyes Layer -->
    
        <!-- Left Eye -->
        <ellipse cx="73.0" cy="54.8" rx="3.2" ry="4.2" fill="#0F172A" />
        <circle cx="71.8" cy="53.6" r="1.4" fill="#FFFFFF" />
        <circle cx="74.0" cy="56.4" r="0.6" fill="#FFFFFF" />
        <!-- Right Eye -->
        <ellipse cx="87.0" cy="54.8" rx="3.2" ry="4.2" fill="#0F172A" />
        <circle cx="85.8" cy="53.6" r="1.4" fill="#FFFFFF" />
        <circle cx="88.0" cy="56.4" r="0.6" fill="#FFFFFF" />
        

    <!-- Mouth Layer -->
    
        <!-- Gentle Storybook Smile -->
        <path d="M 76.0 63.8 Q 80.0 67.8 84.0 63.8" stroke="#78350F" stroke-width="2.0" stroke-linecap="round" fill="none" />
        

    <!-- Front Storybook Hair Bangs (Soft Navy #1E293B) -->
    <path d="M 60.0 52.8 
             C 58.0 38.8 66.0 31.8 80.0 31.8 
             C 94.0 31.8 102.0 38.8 100.0 52.8 
             C 96.0 42.8 90.0 46.8 84.0 46.8 
             C 78.0 46.8 72.0 40.8 68.0 46.8 
             C 65.0 50.8 62.0 48.8 60.0 52.8 Z" 
          fill="#1E293B"/>

    <!-- Explorer Feather & Headband (#FBBF24 golden feather) -->
    <path d="M 61.0 46.8 Q 80.0 36.8 99.0 46.8" 
          stroke="#0D9488" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Feather Pin -->
    <path d="M 96.0 44.8 
             C 102.0 32.8 106.0 24.8 108.0 20.8 
             C 104.0 26.8 100.0 34.8 96.0 44.8 Z" 
          fill="#FBBF24"/>
    <path d="M 97.0 42.8 L 107.0 22.8" 
          stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="96.0" cy="45.8" r="2.2" fill="#0D9488"/>

    <!-- Warm Coral Scarf (#F97316 Front Wrap) -->
    <path d="M 62.0 67.8 
             C 66.0 64.8 94.0 64.8 98.0 67.8 
             C 100.0 73.8 96.0 77.8 86.0 78.8 
             C 74.0 78.8 64.0 75.8 62.0 67.8 Z" 
          fill="url(#scarfGrad)"/>
    <!-- Scarf Front Knot -->
    <ellipse cx="88.0" cy="72.8" rx="4.5" ry="4" fill="#EA580C"/>
    <ellipse cx="88.0" cy="71.8" rx="3.5" ry="3" fill="#F97316"/>
  </g>

  <!-- Optional FX (Sparkles/Sweat) -->
  
</svg>