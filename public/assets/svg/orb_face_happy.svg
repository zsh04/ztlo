<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Light Orb Face - Happy">
  <defs>
    <!-- Outer Ambient Glow -->
    <radialGradient id="orbHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <!-- Core Luminous Sphere -->
    <radialGradient id="orbBody" cx="38%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="18%" stop-color="#FEF08A"/>
      <stop offset="55%" stop-color="#FDE047"/>
      <stop offset="85%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
  </defs>

  <!-- Ambient Golden Aura (Radiates to 88px) -->
  <circle cx="48.0" cy="48.0" r="44" fill="url(#orbHalo)"/>

  <!-- Core Glowing Sphere Body (Radius 34px) -->
  <circle cx="48.0" cy="48.0" r="34.0" fill="url(#orbBody)"/>

  <!-- Glass Specular Highlight (Monument Valley clean reflection) -->
  <path d="M 32.0 24.0 Q 48.0 20.0 60.0 26.0 Q 54.0 32.0 38.0 30.0 Z" 
        fill="#FFFFFF" opacity="0.65"/>
  <circle cx="30.0" cy="36.0" r="3" fill="#FFFFFF" opacity="0.7"/>

  <!-- Facial Expression Layer -->
  
        <!-- Wide Cheerful Crescent Eyes -->
        <path d="M 33.0 45.0 Q 39.0 38.0 45.0 45.0" 
              stroke="#78350F" stroke-width="3.2" stroke-linecap="round" fill="none"/>
        <path d="M 51.0 45.0 Q 57.0 38.0 63.0 45.0" 
              stroke="#78350F" stroke-width="3.2" stroke-linecap="round" fill="none"/>
        <!-- Soft Blush Cheeks -->
        <ellipse cx="34.0" cy="53.0" rx="5.5" ry="3" fill="#FB7185" opacity="0.6"/>
        <ellipse cx="62.0" cy="53.0" rx="5.5" ry="3" fill="#FB7185" opacity="0.6"/>
        <!-- Happy Open Smile with Tongue -->
        <path d="M 41.0 55.0 Q 48.0 65.0 55.0 55.0 Z" fill="#78350F"/>
        <path d="M 44.0 59.0 Q 48.0 64.0 52.0 59.0 Z" fill="#FB7185"/>
        

  <!-- Atmospheric FX (Sparkles/Stardust) -->
  
        <!-- Golden Joyful Radiance Sparkles -->
        <circle cx="16.0" cy="28.0" r="2" fill="#FEF08A" opacity="0.9"/>
        <circle cx="80.0" cy="30.0" r="2.5" fill="#FEF08A" opacity="0.9"/>
        <circle cx="74.0" cy="74.0" r="1.5" fill="#FEF08A" opacity="0.8"/>
        
</svg>