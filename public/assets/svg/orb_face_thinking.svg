<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Light Orb Face - Thinking">
  <defs>
    <!-- Outer Ambient Glow -->
    <radialGradient id="orbHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <!-- Core Luminous Sphere -->
    <radialGradient id="orbBody" cx="38%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="18%" stop-color="#FEF08A"/>
      <stop offset="55%" stop-color="#FDE047"/>
      <stop offset="85%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
  </defs>

  <!-- Ambient Golden Aura (Radiates to 88px) -->
  <circle cx="48.0" cy="48.0" r="44" fill="url(#orbHalo)"/>

  <!-- Core Glowing Sphere Body (Radius 34px) -->
  <circle cx="48.0" cy="48.0" r="34.0" fill="url(#orbBody)"/>

  <!-- Glass Specular Highlight (Monument Valley clean reflection) -->
  <path d="M 32.0 24.0 Q 48.0 20.0 60.0 26.0 Q 54.0 32.0 38.0 30.0 Z" 
        fill="#FFFFFF" opacity="0.65"/>
  <circle cx="30.0" cy="36.0" r="3" fill="#FFFFFF" opacity="0.7"/>

  <!-- Facial Expression Layer -->
  
        <!-- Thoughtful Looking Upward Eyes -->
        <ellipse cx="40.0" cy="42.0" rx="3.8" ry="4.8" fill="#78350F"/>
        <circle cx="38.5" cy="40.5" r="1.6" fill="#FFFFFF"/>
        <ellipse cx="58.0" cy="41.0" rx="3.8" ry="4.8" fill="#78350F"/>
        <circle cx="56.5" cy="39.5" r="1.6" fill="#FFFFFF"/>
        <!-- Pondering Cheeks -->
        <ellipse cx="35.0" cy="52.0" rx="4.5" ry="2.6" fill="#FB7185" opacity="0.45"/>
        <ellipse cx="61.0" cy="52.0" rx="4.5" ry="2.6" fill="#FB7185" opacity="0.45"/>
        <!-- Pondering Wavy Thoughtful Mouth -->
        <path d="M 42.0 55.0 Q 47.0 58.0 50.0 54.0 Q 53.0 55.0 54.0 54.0" 
              stroke="#78350F" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        

  <!-- Atmospheric FX (Sparkles/Stardust) -->
  
        <!-- Floating Idea Sparks -->
        <circle cx="24.0" cy="24.0" r="2" fill="#FFFFFF" opacity="0.8"/>
        <circle cx="32.0" cy="16.0" r="3" fill="#FEF08A" opacity="0.9"/>
        
</svg>