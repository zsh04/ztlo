<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Light Orb Face - Sleepy">
  <defs>
    <!-- Outer Ambient Glow -->
    <radialGradient id="orbHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <!-- Core Luminous Sphere -->
    <radialGradient id="orbBody" cx="38%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="18%" stop-color="#FEF08A"/>
      <stop offset="55%" stop-color="#FDE047"/>
      <stop offset="85%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
  </defs>

  <!-- Ambient Golden Aura (Radiates to 88px) -->
  <circle cx="48.0" cy="48.0" r="44" fill="url(#orbHalo)"/>

  <!-- Core Glowing Sphere Body (Radius 34px) -->
  <circle cx="48.0" cy="48.0" r="34.0" fill="url(#orbBody)"/>

  <!-- Glass Specular Highlight (Monument Valley clean reflection) -->
  <path d="M 32.0 24.0 Q 48.0 20.0 60.0 26.0 Q 54.0 32.0 38.0 30.0 Z" 
        fill="#FFFFFF" opacity="0.65"/>
  <circle cx="30.0" cy="36.0" r="3" fill="#FFFFFF" opacity="0.7"/>

  <!-- Facial Expression Layer -->
  
        <!-- Drowsy Downward Curved Eyelids -->
        <path d="M 34.0 45.0 Q 39.0 51.0 44.0 45.0" 
              stroke="#78350F" stroke-width="2.8" stroke-linecap="round" fill="none"/>
        <path d="M 52.0 45.0 Q 57.0 51.0 62.0 45.0" 
              stroke="#78350F" stroke-width="2.8" stroke-linecap="round" fill="none"/>
        <!-- Gentle Dreamy Blush -->
        <ellipse cx="35.0" cy="53.0" rx="5.5" ry="3.2" fill="#FB7185" opacity="0.7"/>
        <ellipse cx="61.0" cy="53.0" rx="5.5" ry="3.2" fill="#FB7185" opacity="0.7"/>
        <!-- Soft Peaceful Smile -->
        <path d="M 44.0 56.0 Q 48.0 60.0 52.0 56.0" 
              stroke="#78350F" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        

  <!-- Atmospheric FX (Sparkles/Stardust) -->
  
        <!-- Calming Twilight Zzz / Starlight Drift -->
        <text x="70.0" y="32.0" font-family="sans-serif" font-weight="bold" font-size="12" fill="#A5B4FC" opacity="0.85">z</text>
        <text x="76.0" y="22.0" font-family="sans-serif" font-weight="bold" font-size="15" fill="#818CF8" opacity="0.95">Z</text>
        
</svg>