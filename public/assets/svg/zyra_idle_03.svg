<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Zyra - Idle 3/6">
  <defs>
    <!-- Cerulean Cloak Gradients -->
    <linearGradient id="cloakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="25%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="cloakShadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <!-- Coral Scarf Gradients -->
    <linearGradient id="scarfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="30%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <!-- Ground Ambient Shadow -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#0F172A" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground Contact Shadow (80px playfield footprint) -->
  <ellipse cx="80.0" cy="141.0" rx="29.2" ry="7.5" fill="url(#groundShadow)"/>

  <!-- Main Character Group -->
  <g>
    <!-- Back Hair Volume -->
    <path d="M 56.0 59.5 C 52.0 77.5 58.0 89.5 66.0 93.5 
             C 80.0 95.5 94.0 93.5 102.0 89.5 
             C 108.0 77.5 104.0 59.5 Z" fill="#0F172A"/>

    <!-- Left Leg & Boot -->
    <g transform="rotate(0.0 68.0 103.5)">
      <path d="M 64.0 103.5 L 65.0 132.0 L 71.0 132.0 L 72.0 103.5 Z" fill="#475569"/>
      <!-- Explorer Boot Left -->
      <path d="M 63.0 132.0 Q 63.0 138.0 60.0 140.0 L 73.0 140.0 Q 74.0 135.0 72.0 132.0 Z" fill="#334155"/>
      <path d="M 60.0 139.0 L 74.0 139.0 L 73.0 141.0 L 61.0 141.0 Z" fill="#1E293B"/>
    </g>

    <!-- Right Leg & Boot -->
    <g transform="rotate(0.0 92.0 103.5)">
      <path d="M 88.0 103.5 L 89.0 132.0 L 95.0 132.0 L 96.0 103.5 Z" fill="#475569"/>
      <!-- Explorer Boot Right -->
      <path d="M 88.0 132.0 Q 86.0 135.0 87.0 140.0 L 100.0 140.0 Q 97.0 138.0 97.0 132.0 Z" fill="#334155"/>
      <path d="M 87.0 139.0 L 100.0 139.0 L 99.0 141.0 L 88.0 141.0 Z" fill="#1E293B"/>
    </g>

    <!-- Cerulean Cloak Underlayer -->
    <g transform="rotate(1.5 80.0 83.5)">
      <!-- Back Hem Flap -->
      <path d="M 54.0 97.5 Q 80.0 101.5 106.0 97.5 
               L 108.0 117.5 Q 80.0 121.5 52.0 117.5 Z" 
            fill="url(#cloakShadowGrad)"/>

      <!-- Primary Ghibli Poncho / Cloak (#0284C7 cerulean teal) -->
      <path d="M 64.0 79.5 
               C 56.0 85.5 50.0 99.5 52.0 115.5 
               Q 54.0 119.5 60.0 118.5 
               C 70.0 116.5 90.0 116.5 100.0 118.5 
               Q 106.0 119.5 108.0 115.5 
               C 110.0 99.5 104.0 85.5 96.0 79.5 Z" 
            fill="url(#cloakGrad)"/>

      <!-- Cloak Fold Highlights & Seam Detailing -->
      <path d="M 66.0 83.5 Q 58.0 103.5 64.0 117.5" 
            stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.6"/>
      <path d="M 80.0 87.5 L 80.0 116.5" 
            stroke="#0369A1" stroke-width="2.0" stroke-linecap="round" fill="none" opacity="0.7"/>
      <path d="M 94.0 83.5 Q 102.0 103.5 96.0 117.5" 
            stroke="#0369A1" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8"/>
    </g>

    <!-- Arms Layer -->
    
        <!-- Resting Hands Tucked Neatly in Cloak -->
        <ellipse cx="66.0" cy="99.5" rx="4.5" ry="6" fill="#0284C7" />
        <circle cx="68.0" cy="103.5" r="3.5" fill="#FED7AA" />
        <ellipse cx="94.0" cy="99.5" rx="4.5" ry="6" fill="#0284C7" />
        <circle cx="92.0" cy="103.5" r="3.5" fill="#FED7AA" />
        

    <!-- Trailing Scarf Ribbon (Back fold) -->
    <g transform="rotate(2.5 90.0 69.5)">
      <path d="M 90.0 69.5 
               Q 104.0 75.5 114.0 85.5 
               Q 106.0 89.5 94.0 77.5 Z" 
            fill="#EA580C"/>
      <path d="M 94.0 73.5 
               Q 110.0 81.5 118.0 91.5 
               Q 112.0 97.5 96.0 79.5 Z" 
            fill="url(#scarfGrad)"/>
      <path d="M 114.0 90.5 L 117.0 92.5" stroke="#FED7AA" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Head / Face (Warm Soft Peach #FED7AA) -->
    <circle cx="80.0" cy="53.5" r="19" fill="#FED7AA"/>
    <!-- Subtle Rosy Cheeks -->
    <ellipse cx="69.0" cy="59.5" rx="4.5" ry="2.6" fill="#FDA4AF" opacity="0.75"/>
    <ellipse cx="91.0" cy="59.5" rx="4.5" ry="2.6" fill="#FDA4AF" opacity="0.75"/>
    <!-- Tiny Cute Nose -->
    <circle cx="80.0" cy="58.5" r="0.9" fill="#FDBA74"/>

    <!-- Eyes Layer -->
    
        <!-- Left Eye -->
        <ellipse cx="73.0" cy="53.5" rx="3.2" ry="4.2" fill="#0F172A" />
        <circle cx="71.8" cy="52.3" r="1.4" fill="#FFFFFF" />
        <circle cx="74.0" cy="55.1" r="0.6" fill="#FFFFFF" />
        <!-- Right Eye -->
        <ellipse cx="87.0" cy="53.5" rx="3.2" ry="4.2" fill="#0F172A" />
        <circle cx="85.8" cy="52.3" r="1.4" fill="#FFFFFF" />
        <circle cx="88.0" cy="55.1" r="0.6" fill="#FFFFFF" />
        

    <!-- Mouth Layer -->
    
        <!-- Gentle Storybook Smile -->
        <path d="M 76.0 62.5 Q 80.0 66.5 84.0 62.5" stroke="#78350F" stroke-width="2.0" stroke-linecap="round" fill="none" />
        

    <!-- Front Storybook Hair Bangs (Soft Navy #1E293B) -->
    <path d="M 60.0 51.5 
             C 58.0 37.5 66.0 30.5 80.0 30.5 
             C 94.0 30.5 102.0 37.5 100.0 51.5 
             C 96.0 41.5 90.0 45.5 84.0 45.5 
             C 78.0 45.5 72.0 39.5 68.0 45.5 
             C 65.0 49.5 62.0 47.5 60.0 51.5 Z" 
          fill="#1E293B"/>

    <!-- Explorer Feather & Headband (#FBBF24 golden feather) -->
    <path d="M 61.0 45.5 Q 80.0 35.5 99.0 45.5" 
          stroke="#0D9488" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Feather Pin -->
    <path d="M 96.0 43.5 
             C 102.0 31.5 106.0 23.5 108.0 19.5 
             C 104.0 25.5 100.0 33.5 96.0 43.5 Z" 
          fill="#FBBF24"/>
    <path d="M 97.0 41.5 L 107.0 21.5" 
          stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="96.0" cy="44.5" r="2.2" fill="#0D9488"/>

    <!-- Warm Coral Scarf (#F97316 Front Wrap) -->
    <path d="M 62.0 66.5 
             C 66.0 63.5 94.0 63.5 98.0 66.5 
             C 100.0 72.5 96.0 76.5 86.0 77.5 
             C 74.0 77.5 64.0 74.5 62.0 66.5 Z" 
          fill="url(#scarfGrad)"/>
    <!-- Scarf Front Knot -->
    <ellipse cx="88.0" cy="71.5" rx="4.5" ry="4" fill="#EA580C"/>
    <ellipse cx="88.0" cy="70.5" rx="3.5" ry="3" fill="#F97316"/>
  </g>

  <!-- Optional FX (Sparkles/Sweat) -->
  
</svg>