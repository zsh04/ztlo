<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Zyra - Celebrate 7/8">
  <defs>
    <!-- Cerulean Cloak Gradients -->
    <linearGradient id="cloakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="25%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="cloakShadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <!-- Coral Scarf Gradients -->
    <linearGradient id="scarfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="30%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <!-- Ground Ambient Shadow -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#0F172A" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground Contact Shadow (80px playfield footprint) -->
  <ellipse cx="80.0" cy="141.0" rx="26.8" ry="6.5" fill="url(#groundShadow)"/>

  <!-- Main Character Group -->
  <g>
    <!-- Back Hair Volume -->
    <path d="M 56.0 64.5 C 52.0 82.5 58.0 94.5 66.0 98.5 
             C 80.0 100.5 94.0 98.5 102.0 94.5 
             C 108.0 82.5 104.0 64.5 Z" fill="#0F172A"/>

    <!-- Left Leg & Boot -->
    <g transform="rotate(0.0 68.0 108.5)">
      <path d="M 64.0 108.5 L 65.0 132.0 L 71.0 132.0 L 72.0 108.5 Z" fill="#475569"/>
      <!-- Explorer Boot Left -->
      <path d="M 63.0 132.0 Q 63.0 138.0 60.0 140.0 L 73.0 140.0 Q 74.0 135.0 72.0 132.0 Z" fill="#334155"/>
      <path d="M 60.0 139.0 L 74.0 139.0 L 73.0 141.0 L 61.0 141.0 Z" fill="#1E293B"/>
    </g>

    <!-- Right Leg & Boot -->
    <g transform="rotate(0.0 92.0 108.5)">
      <path d="M 88.0 108.5 L 89.0 132.0 L 95.0 132.0 L 96.0 108.5 Z" fill="#475569"/>
      <!-- Explorer Boot Right -->
      <path d="M 88.0 132.0 Q 86.0 135.0 87.0 140.0 L 100.0 140.0 Q 97.0 138.0 97.0 132.0 Z" fill="#334155"/>
      <path d="M 87.0 139.0 L 100.0 139.0 L 99.0 141.0 L 88.0 141.0 Z" fill="#1E293B"/>
    </g>

    <!-- Cerulean Cloak Underlayer -->
    <g>
      <!-- Back Hem Flap -->
      <path d="M 54.0 102.5 Q 80.0 106.5 106.0 102.5 
               L 108.0 122.5 Q 80.0 126.5 52.0 122.5 Z" 
            fill="url(#cloakShadowGrad)"/>

      <!-- Primary Ghibli Poncho / Cloak (#0284C7 cerulean teal) -->
      <path d="M 64.0 84.5 
               C 56.0 90.5 50.0 104.5 52.0 120.5 
               Q 54.0 124.5 60.0 123.5 
               C 70.0 121.5 90.0 121.5 100.0 123.5 
               Q 106.0 124.5 108.0 120.5 
               C 110.0 104.5 104.0 90.5 96.0 84.5 Z" 
            fill="url(#cloakGrad)"/>

      <!-- Cloak Fold Highlights & Seam Detailing -->
      <path d="M 66.0 88.5 Q 58.0 108.5 64.0 122.5" 
            stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.6"/>
      <path d="M 80.0 92.5 L 80.0 121.5" 
            stroke="#0369A1" stroke-width="2.0" stroke-linecap="round" fill="none" opacity="0.7"/>
      <path d="M 94.0 88.5 Q 102.0 108.5 96.0 122.5" 
            stroke="#0369A1" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8"/>
    </g>

    <!-- Arms Layer -->
    
        <!-- Wide Open Celebrating Arms -->
        <path d="M 66.0 92.5 Q 50.0 86.5 46.0 74.5" 
              stroke="#0284C7" stroke-width="9" stroke-linecap="round" fill="none" />
        <circle cx="45.0" cy="72.5" r="5.5" fill="#FED7AA" />
        <path d="M 94.0 92.5 Q 110.0 86.5 114.0 74.5" 
              stroke="#0284C7" stroke-width="9" stroke-linecap="round" fill="none" />
        <circle cx="115.0" cy="72.5" r="5.5" fill="#FED7AA" />
        

    <!-- Trailing Scarf Ribbon (Back fold) -->
    <g transform="rotate(2.0 90.0 74.5)">
      <path d="M 90.0 74.5 
               Q 104.0 80.5 114.0 90.5 
               Q 106.0 94.5 94.0 82.5 Z" 
            fill="#EA580C"/>
      <path d="M 94.0 78.5 
               Q 110.0 86.5 118.0 96.5 
               Q 112.0 102.5 96.0 84.5 Z" 
            fill="url(#scarfGrad)"/>
      <path d="M 114.0 95.5 L 117.0 97.5" stroke="#FED7AA" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Head / Face (Warm Soft Peach #FED7AA) -->
    <circle cx="80.0" cy="58.5" r="19" fill="#FED7AA"/>
    <!-- Subtle Rosy Cheeks -->
    <ellipse cx="69.0" cy="64.5" rx="4.5" ry="2.6" fill="#FDA4AF" opacity="0.75"/>
    <ellipse cx="91.0" cy="64.5" rx="4.5" ry="2.6" fill="#FDA4AF" opacity="0.75"/>
    <!-- Tiny Cute Nose -->
    <circle cx="80.0" cy="63.5" r="0.9" fill="#FDBA74"/>

    <!-- Eyes Layer -->
    
        <!-- Left Eye -->
        <ellipse cx="73.0" cy="58.5" rx="3.2" ry="4.2" fill="#0F172A" />
        <circle cx="71.8" cy="57.3" r="1.4" fill="#FFFFFF" />
        <circle cx="74.0" cy="60.1" r="0.6" fill="#FFFFFF" />
        <!-- Right Eye -->
        <ellipse cx="87.0" cy="58.5" rx="3.2" ry="4.2" fill="#0F172A" />
        <circle cx="85.8" cy="57.3" r="1.4" fill="#FFFFFF" />
        <circle cx="88.0" cy="60.1" r="0.6" fill="#FFFFFF" />
        

    <!-- Mouth Layer -->
    
        <!-- Gentle Storybook Smile -->
        <path d="M 76.0 67.5 Q 80.0 71.5 84.0 67.5" stroke="#78350F" stroke-width="2.0" stroke-linecap="round" fill="none" />
        

    <!-- Front Storybook Hair Bangs (Soft Navy #1E293B) -->
    <path d="M 60.0 56.5 
             C 58.0 42.5 66.0 35.5 80.0 35.5 
             C 94.0 35.5 102.0 42.5 100.0 56.5 
             C 96.0 46.5 90.0 50.5 84.0 50.5 
             C 78.0 50.5 72.0 44.5 68.0 50.5 
             C 65.0 54.5 62.0 52.5 60.0 56.5 Z" 
          fill="#1E293B"/>

    <!-- Explorer Feather & Headband (#FBBF24 golden feather) -->
    <path d="M 61.0 50.5 Q 80.0 40.5 99.0 50.5" 
          stroke="#0D9488" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Feather Pin -->
    <path d="M 96.0 48.5 
             C 102.0 36.5 106.0 28.5 108.0 24.5 
             C 104.0 30.5 100.0 38.5 96.0 48.5 Z" 
          fill="#FBBF24"/>
    <path d="M 97.0 46.5 L 107.0 26.5" 
          stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="96.0" cy="49.5" r="2.2" fill="#0D9488"/>

    <!-- Warm Coral Scarf (#F97316 Front Wrap) -->
    <path d="M 62.0 71.5 
             C 66.0 68.5 94.0 68.5 98.0 71.5 
             C 100.0 77.5 96.0 81.5 86.0 82.5 
             C 74.0 82.5 64.0 79.5 62.0 71.5 Z" 
          fill="url(#scarfGrad)"/>
    <!-- Scarf Front Knot -->
    <ellipse cx="88.0" cy="76.5" rx="4.5" ry="4" fill="#EA580C"/>
    <ellipse cx="88.0" cy="75.5" rx="3.5" ry="3" fill="#F97316"/>
  </g>

  <!-- Optional FX (Sparkles/Sweat) -->
  
</svg>