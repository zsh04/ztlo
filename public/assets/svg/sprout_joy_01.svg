<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <linearGradient id="sproutBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="40%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <linearGradient id="sproutBellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#BBF7D0" />
    </linearGradient>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="80" cy="142" rx="46" ry="10" fill="#000000" fill-opacity="0.14" />

  <!-- Sunny Golden Joy Aura & Celebratory Sparkles -->
  <circle cx="80.0" cy="94.0" r="52" fill="#FDE047" fill-opacity="0.14" />
  <g fill="#FACC15" opacity="0.40">
    <polygon points="44.0,66.0 46.0,70.0 50.0,72.0 46.0,74.0 44.0,78.0 42.0,74.0 38.0,72.0 42.0,70.0" />
    <polygon points="116.0,62.0 118.0,66.0 122.0,68.0 118.0,70.0 116.0,74.0 114.0,70.0 110.0,68.0 114.0,66.0" />
    <circle cx="52.0" cy="112.0" r="2" fill="#F472B6" />
    <circle cx="110.0" cy="108.0" r="2" fill="#F472B6" />
  </g>

  <!-- Main Sprout Body Group -->
  <g transform="translate(0, 0.0)">
    <!-- Tiny Stubby Woodland Feet -->
    <ellipse cx="64" cy="128.0" rx="8" ry="5" fill="#15803D" />
    <ellipse cx="96" cy="128.0" rx="8" ry="5" fill="#15803D" />

    <!-- Leaf Ears -->
      <path d="M 64.0 60.0 C 44.0 38.0 32.0 56.0 56.0 68.0 Z" fill="#4ADE80" stroke="#15803D" stroke-width="2.2" />
      <path d="M 96.0 60.0 C 116.0 38.0 128.0 56.0 104.0 68.0 Z" fill="#4ADE80" stroke="#15803D" stroke-width="2.2" />
      <!-- Blossoming Sakura Flower Crown -->
      <circle cx="80.0" cy="54.0" r="7" fill="#F472B6" />
      <circle cx="74.0" cy="50.0" r="5.5" fill="#F472B6" />
      <circle cx="86.0" cy="50.0" r="5.5" fill="#F472B6" />
      <circle cx="75.0" cy="58.0" r="5.5" fill="#F472B6" />
      <circle cx="85.0" cy="58.0" r="5.5" fill="#F472B6" />
      <circle cx="80.0" cy="54.0" r="4" fill="#FDE047" stroke="#F59E0B" stroke-width="1" />

    <!-- Plump Pear-Shaped Moss Body -->
    <path d="M 48.0 122.0 C 36.0 116.0 42.0 78.0 56.0 64.0 C 66.0 54.0 94.0 54.0 104.0 64.0 C 118.0 78.0 124.0 116.0 112.0 122.0 C 100.0 130.0 60.0 130.0 48.0 122.0 Z" fill="url(#sproutBodyGrad)" stroke="#15803D" stroke-width="2.6" />

    <!-- Soft Pastel Cream Underbelly Patch -->
    <ellipse cx="80.0" cy="108.0" rx="22" ry="18" fill="url(#sproutBellyGrad)" />
    <!-- Three Subtle Belly Clover Flecks -->
    <circle cx="74.0" cy="106.0" r="1.4" fill="#16A34A" opacity="0.5" />
    <circle cx="86.0" cy="106.0" r="1.4" fill="#16A34A" opacity="0.5" />
    <circle cx="80.0" cy="112.0" r="1.4" fill="#16A34A" opacity="0.5" />

    <!-- Rosy Woodland Cheeks -->
    <circle cx="58.0" cy="98.0" r="6.5" fill="#FCA5A5" fill-opacity="0.65" />
    <circle cx="102.0" cy="98.0" r="6.5" fill="#FCA5A5" fill-opacity="0.65" />

      <!-- Joyful Arc Eyes (^ _ ^) -->
      <path d="M 62.0 92.0 Q 67.0 84.0 72.0 92.0" stroke="#14532D" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M 88.0 92.0 Q 93.0 84.0 98.0 92.0" stroke="#14532D" stroke-width="3" stroke-linecap="round" fill="none" />

      <path d="M 72.0 104.0 Q 80.0 116.0 88.0 104.0 Z" fill="#DC2626" stroke="#991B1B" stroke-width="1.8" />
      <path d="M 75.0 109.0 Q 80.0 114.0 85.0 109.0" fill="#FDA4AF" />

    <!-- Tiny Leaf Resting Hands -->
    <ellipse cx="54.0" cy="112.0" rx="5" ry="3.5" fill="#4ADE80" stroke="#15803D" stroke-width="1.5" />
    <ellipse cx="106.0" cy="112.0" rx="5" ry="3.5" fill="#4ADE80" stroke="#15803D" stroke-width="1.5" />
  </g>
</svg>