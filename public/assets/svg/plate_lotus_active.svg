      <path d="M 80 80 Q 80 50 80 36" stroke="#ECFDF5" stroke-width="2" stroke-linecap="round" fill="none" />
    </g>

    <g transform="rotate(180 80 80)">
      <path d="M 80 80 C 70 66 64 52 80 34 C 96 52 90 66 80 80 Z" fill="url(#petalActiveGrad)" stroke="#10B981" stroke-width="2" />
      <path d="M 80 80 Q 80 50 80 36" stroke="#ECFDF5" stroke-width="2" stroke-linecap="round" fill="none" />
    </g>

    <g transform="rotate(225 80 80)">
      <path d="M 80 80 C 70 66 64 52 80 34 C 96 52 90 66 80 80 Z" fill="url(#petalActiveGrad)" stroke="#10B981" stroke-width="2" />
      <path d="M 80 80 Q 80 50 80 36" stroke="#ECFDF5" stroke-width="2" stroke-linecap="round" fill="none" />
    </g>

    <g transform="rotate(270 80 80)">
      <path d="M 80 80 C 70 66 64 52 80 34 C 96 52 90 66 80 80 Z" fill="url(#petalActiveGrad)" stroke="#10B981" stroke-width="2" />
      <path d="M 80 80 Q 80 50 80 36" stroke="#ECFDF5" stroke-width="2" stroke-linecap="round" fill="none" />
    </g>

    <g transform="rotate(315 80 80)">
      <path d="M 80 80 C 70 66 64 52 80 34 C 96 52 90 66 80 80 Z" fill="url(#petalActiveGrad)" stroke="#10B981" stroke-width="2" />
      <path d="M 80 80 Q 80 50 80 36" stroke="#ECFDF5" stroke-width="2" stroke-linecap="round" fill="none" />
