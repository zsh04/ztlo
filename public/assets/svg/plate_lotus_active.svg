  <!-- Glowing Emerald Lotus Center Jewel -->
  <circle cx="80" cy="80" r="16" fill="#10B981" stroke="#ECFDF5" stroke-width="3" />
  <circle cx="80" cy="80" r="8" fill="#FFFFFF" />
  <circle cx="78" cy="78" r="2.5" fill="#ECFDF5" />
</svg>