name: PWA Build & Artifact Delivery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-archive:
    name: Build PWA & Archive Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production PWA
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ztlo-pwa-build
          path: |
            .next/standalone
            .next/static
            public
          retention-days: 14
