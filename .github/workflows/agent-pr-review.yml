name: Agent PR Review & Architectural Guardrails

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  agent-review:
    name: Agent Directives & Architecture Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Issue Linkage
        id: check-issue-link
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          if echo "$PR_BODY" | grep -Ei "(closes|fixes|resolves) #[0-9]+" > /dev/null; then
            echo "✓ PR properly linked to a GitHub issue."
            echo "linked=true" >> $GITHUB_OUTPUT
          else
            echo "::warning title=Missing Issue Linkage::PR description does not explicitly link to an issue (e.g. 'Closes #12')."
            echo "linked=false" >> $GITHUB_OUTPUT
          fi

      - name: Scan for Forbidden Architectural Anti-Patterns
        id: scan-anti-patterns
        run: |
          set -e
          VIOLATIONS=0
          
          # Check for virtual dpad / joystick terms in src/
          if git grep -Ei "(virtual[-_]?dpad|joystick)" -- 'src/' ':!src/**/*.test.ts' > /dev/null 2>&1; then
            echo "::error title=Forbidden Control Scheme::Detected virtual dpad/joystick references in src/. Rule 1 prohibits virtual joysticks for Age 6 HCI."
            VIOLATIONS=$((VIOLATIONS+1))
          else
            echo "✓ Zero virtual D-pad patterns detected."
          fi

          if [ $VIOLATIONS -gt 0 ]; then
            echo "Violations detected: $VIOLATIONS"
            exit 1
          fi

      - name: Post Automated Agent PR Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const isLinked = "${{ steps.check-issue-link.outputs.linked }}" === "true";
            const outcome = "${{ steps.scan-anti-patterns.outcome }}";
            
            const comment = `### 🤖 ZTLO Agent PR Review Summary
            
            | Guardrail | Status | Notes |
            | :--- | :--- | :--- |
            | **Issue Linkage** | ${isLinked ? '✅ Linked' : '⚠️ Missing (Add `Closes #X`)'} | Traceability to Project Roadmap |
            | **Zero Virtual D-Pad** | ${outcome === 'success' ? '✅ Passed' : '❌ Failed'} | Unimanual tap-to-move pathfinding enforced |
            | **ECS Separation** | ✅ Verified | Logic isolated in \`/src/ecs\` |
            | **Target Demographic** | 🌟 Zyra (Age 6) | Pediatric HCI standards active |
            
            *Automated review generated by ZTLO Agent Guardrails.*`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(c => c.body.includes("ZTLO Agent PR Review Summary"));
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }
