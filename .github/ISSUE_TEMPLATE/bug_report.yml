name: Bug Report
description: Report a touch UX friction issue, physics glitch, or software defect.
title: "[Bug]: "
labels: ["type:bug", "status:ready"]
body:
  - type: markdown
    attributes:
      value: |
        Please help us keep **Zyra & The Light Orb** frictionless for early childhood learners by reporting bugs.
  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: A clear and concise description of the problem.
      placeholder: What went wrong?
    validations:
      required: true
  - type: dropdown
    id: device-environment
    attributes:
      label: Device / Browser Environment
      description: What device or browser was this observed on?
      options:
        - "iPad / iOS Safari (PWA)"
        - "Android Tablet / Chrome (PWA)"
        - "Desktop Chrome / Safari / Edge"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to recreate the bug.
      placeholder: |
        1. Tap on ...
        2. Drag / push ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected vs Actual Behavior
      description: What should have happened vs what actually happened?
    validations:
      required: true
